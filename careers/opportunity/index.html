
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fffaf4">

    <meta
        name="description"
        content="Opportunity details from Corceptive Media Careers."
    >

    <title>Opportunity details | Corceptive Media Careers</title>
    <link rel="icon" type="image/x-icon" href="https://corceptivemedia.com/cmfavicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --cream: #fffaf4;
            --pale: #f7efe5;
            --wine: #4a1e2b;
            --ink: #2c2224;
            --muted: #766b68;
            --orange: #e56b2f;
            --gold: #c9a84c;
            --line: #e5d8cb;

            --serif: 'Cormorant Garamond', Georgia, serif;
            --sans: 'Manrope', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .wrap {
            width: min(1080px, 88vw);
            margin: auto;
        }

        .eyebrow {
            font-size: 9px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--orange);
            font-weight: 800;
        }

        /* Header */

        header {
            height: 74px;
            background: #fffdf9;
            border-bottom: 1px solid var(--line);
        }

        .nav {
            width: min(1280px, 90vw);
            height: 100%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--wine);
            font: 600 23px var(--serif);
        }

        .brand img {
            width: 39px;
            height: 39px;
            object-fit: contain;
        }

        .back {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--orange);
        }

        /* Hero */

        .hero {
            background: linear-gradient(110deg, #fffaf4, #f7ede3);
            border-bottom: 1px solid var(--line);
            padding: 52px 0 46px;
        }

        .hero h1 {
            font: 600 clamp(42px, 5.4vw, 66px)/.95 var(--serif);
            letter-spacing: -.025em;
            color: var(--wine);
            margin: 14px 0 10px;
            max-width: 850px;
        }

        .lead {
            font-size: 14px;
            line-height: 1.85;
            color: var(--muted);
            max-width: 760px;
        }

        .meta {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-top: 19px;
        }

        .chip {
            padding: 8px 10px;
            background: #f2e6db;
            color: #6b4f4a;
            font-size: 8px;
            letter-spacing: .04em;
        }

        /* Content layout */

        .content {
            padding: 43px 0 75px;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 265px;
            gap: 22px;
            align-items: start;
        }

        .main-card,
        .side-card {
            background: #fffdf9;
            border: 1px solid var(--line);
            padding: 27px;
        }

        .main-card section + section {
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
        }

        .main-card h2 {
            font: 600 27px var(--serif);
            color: var(--wine);
            margin: 0 0 12px;
            line-height: 1.2;
        }

        /* Opportunity descriptions and responsibilities */

        .main-card p,
        .main-card li {
            font-size: 14px;
            line-height: 1.85;
            color: #6d625d;
        }

        .main-card ul {
            padding-left: 18px;
            margin: 0;
        }

        /* Sidebar */

        .side-card {
            position: sticky;
            top: 22px;
            background: #fbf3eb;
        }

        .side-card h3 {
            font: 600 27px/1 var(--serif);
            color: var(--wine);
            margin: 0 0 10px;
        }

        .side-card p {
            font-size: 10px;
            line-height: 1.8;
            color: var(--muted);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--orange);
            color: white;
            padding: 14px 15px;
            margin-top: 16px;
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .12em;
        }

        .btn:hover {
            background: var(--wine);
        }

        .source-link {
            display: inline-block;
            margin-top: 11px;
            font-size: 9px;
            font-weight: 800;
            color: var(--orange);
        }

        .tiny {
            font-size: 8px !important;
            color: #91847a !important;
            margin-top: 13px;
        }

        /* Loading and error states */

        .state {
            margin: 55px auto;
            background: #fffdf9;
            border: 1px solid var(--line);
            padding: 34px;
            max-width: 680px;
            text-align: center;
        }

        .state h2 {
            font: 600 32px var(--serif);
            color: var(--wine);
            margin: 0 0 9px;
        }

        .state p {
            font-size: 11px;
            line-height: 1.8;
            color: var(--muted);
        }

        .state .btn {
            display: inline-flex;
            margin-top: 14px;
        }

        /* Mobile */

        @media (max-width: 700px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .side-card {
                position: static;
            }

            .hero {
                padding: 42px 0;
            }

            .content {
                padding: 29px 0 55px;
            }

            .main-card,
            .side-card {
                padding: 22px;
            }
        }

<body>

    <header class="cm-careers-header"><div class="nav"><a class="brand" href="/" aria-label="Corceptive Media home"><img src="/Corceptive_Media_Logo.png" alt=""><span>Corceptive Media</span></a><button class="menu" type="button" aria-expanded="false" aria-controls="navlinks">Menu</button><nav class="navlinks" id="navlinks" aria-label="Main navigation"><a href="/">Home</a><a href="/about">About</a><a href="/careers/" aria-current="page">Careers</a><a href="/services">Services</a><a href="/contact">Contact</a></nav></div></header>

    <main id="root">
        <div class="state">
            <h2>Loading opportunity…</h2>
            <p>Retrieving the latest published details.</p>
        </div>
    </main>

    <script>
        (function () {
            'use strict';

            var API = 'https://script.google.com/macros/s/AKfycbwN2yoH-MHqysBi1cJEYj_f1iKbkYgCDHmMvCkzgttRS0uDkLGopfIhR6oPuwZlhqDecQ/exec';

            var params = new URLSearchParams(location.search);
            var type = params.get('type') || '';
            var id = params.get('id') || '';
            var root = document.getElementById('root');

            function esc(v) {
                return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
                    return {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    }[c];
                });
            }

            function safeUrl(value) {
                var s = String(value || '').trim();

                if (!s) return '';

                try {
                    var u = new URL(s, location.origin);

                    return (u.protocol === 'https:' || u.protocol === 'http:')
                        ? u.href
                        : '';

                } catch (e) {
                    return '';
                }
            }

            function request() {
                return new Promise(function (resolve, reject) {
                    var callback = 'cmCareerDetailCallback';
                    var script = document.createElement('script');
                    var url = new URL(API);
                    var timer;

                    url.searchParams.set('action', 'detail');
                    url.searchParams.set('type', type);
                    url.searchParams.set('id', id);
                    url.searchParams.set('prefix', callback);

                    function cleanup() {
                        clearTimeout(timer);
                        script.remove();

                        try {
                            delete window[callback];
                        } catch (e) {
                            window[callback] = undefined;
                        }
                    }

                    window[callback] = function (response) {
                        cleanup();

                        if (response && response.ok === true && response.item) {
                            resolve(response.item);
                        } else {
                            reject(new Error(
                                response && response.error ||
                                'This opportunity is no longer available.'
                            ));
                        }
                    };

                    script.onerror = function () {
                        cleanup();
                        reject(new Error('The Careers service could not be reached.'));
                    };

                    timer = setTimeout(function () {
                        cleanup();
                        reject(new Error('The request timed out.'));
                    }, 12000);

                    script.src = url.toString();
                    document.head.appendChild(script);
                });
            }

            function parts(value) {
                return value
                    ? String(value)
                        .split(/\n|\||;/)
                        .map(function (s) {
                            return s.trim();
                        })
                        .filter(Boolean)
                    : [];
            }

            function section(label, value, list) {
                if (
                    value === undefined ||
                    value === null ||
                    String(value).trim() === ''
                ) {
                    return '';
                }

                if (list) {
                    var items = parts(value);

                    return items.length
                        ? '<section><h2>' + esc(label) + '</h2><ul>' +
                            items.map(function (x) {
                                return '<li>' + esc(x) + '</li>';
                            }).join('') +
                            '</ul></section>'
                        : '';
                }

                return '<section><h2>' + esc(label) + '</h2><p>' +
                    esc(value).replace(/\n/g, '<br>') +
                    '</p></section>';
            }

            function render(item) {
                var isEarly = type === 'early-career';

                var category = isEarly
                    ? 'Early-career opportunity'
                    : type === 'projects'
                        ? 'Project experience'
                        : 'Internship programme';

                var summary = [
                    item.employer,
                    item.duration,
                    item.work_mode,
                    item.location,
                    item.experience_level,
                    item.employment_type
                ].filter(Boolean).slice(0, 5);

                var details = section(
                    'About this opportunity',
                    item.full_description || item.short_description,
                    false
                );

                details += section(
                    isEarly ? 'Requirements' : 'Who can apply',
                    item.requirements || item.eligibility,
                    true
                );

                details += section(
                    type === 'projects'
                        ? 'Expected deliverables'
                        : 'Responsibilities',
                    item.deliverables || item.responsibilities,
                    true
                );

                details += section(
                    'Skills and experience',
                    item.skills,
                    true
                );

                details += section(
                    'Learning outcomes',
                    item.learning_outcomes,
                    true
                );

                details += section(
                    'Guidance and supervision',
                    item.supervision,
                    true
                );

                var timing = [
                    item.duration,
                    item.start_date
                        ? 'Start date: ' + item.start_date
                        : '',
                    item.application_deadline
                        ? 'Application deadline: ' + item.application_deadline
                        : ''
                ].filter(Boolean).join('\n');

                details += section(
                    'Programme details',
                    timing,
                    false
                );

                details += section(
                    type === 'projects' ? 'Programme enrollment' : 'Compensation',
                    item.compensation_details ||
                    item.salary_range ||
                    item.compensation_type,
                    false
                );

                details += section(
                    'Programme fee',
                    item.programme_fee
                        ? String(item.currency || '') + ' ' + String(item.programme_fee)
                        : '',
                    false
                );

                // Corceptive internships and projects use the shared application form.
                // Early-career listings retain the employer's external application route.
                var externalDestination = safeUrl(item.external_application_url);
                var legacyDestination = safeUrl(item.application_url);
                var destination = isEarly
                    ? (externalDestination || legacyDestination || '/careers/apply/?type=' +
                        encodeURIComponent(type) + '&id=' + encodeURIComponent(item.listing_id || id))
                    : '/careers/apply/?type=' + encodeURIComponent(type) +
                        '&id=' + encodeURIComponent(item.listing_id || id);

                var actionText = isEarly && externalDestination
                    ? 'Apply on employer website ↗'
                    : 'Apply now ↗';

                var source = safeUrl(item.source_url);

                root.innerHTML =
                    '<section class="hero">' +
                        '<div class="wrap">' +
                            '<p class="eyebrow">Careers / ' +
                                esc(category) +
                            '</p>' +

                            '<h1>' +
                                esc(item.title || 'Opportunity details') +
                            '</h1>' +

                            '<p class="lead">' +
                                esc(
                                    item.short_description ||
                                    'Review the details and next steps for this opportunity.'
                                ) +
                            '</p>' +

                            '<div class="meta">' +
                                summary.map(function (x) {
                                    return '<span class="chip">' +
                                        esc(x) +
                                        '</span>';
                                }).join('') +

                                '<span class="chip">' +
                                    esc(item.effective_status || 'Open') +
                                '</span>' +
                            '</div>' +
                        '</div>' +
                    '</section>' +

                    '<section class="content">' +
                        '<div class="wrap layout">' +

                            '<article class="main-card">' +
                                details +
                            '</article>' +

                            '<aside class="side-card">' +
                                '<h3>Take the next step.</h3>' +

                                '<p>' +
                                    'Review the details above. Use the link below to apply or contact the Corceptive Media team with questions about this listing.' +
                                '</p>' +

                                '<a class="btn" href="' +
                                    esc(destination) +
                                    '" ' +
                                    (
                                        destination !== '/contact'
                                            ? 'target="_blank" rel="noopener noreferrer"'
                                            : ''
                                    ) +
                                '>' +
                                    esc(actionText) +
                                '</a>' +

                                (
                                    source
                                        ? '<a class="source-link" href="' +
                                            esc(source) +
                                            '" target="_blank" rel="noopener noreferrer">' +
                                            'View original listing ↗</a>'
                                        : ''
                                ) +

                                '<p class="tiny">Reference: ' +
                                    esc(item.listing_id || item.title || 'Careers opportunity') +
                                '</p>' +
                            '</aside>' +

                        '</div>' +
                    '</section>';

                document.title =
                    (item.title || 'Opportunity') +
                    ' | Corceptive Media Careers';
            }

            if (
                !['internships', 'projects', 'early-career'].includes(type) ||
                !id
            ) {
                root.innerHTML =
                    '<div class="state">' +
                        '<h2>Opportunity not found</h2>' +
                        '<p>The requested listing link is incomplete or invalid.</p>' +
                        '<a class="btn" href="/careers/">Return to Careers</a>' +
                    '</div>';

                return;
            }

            request()
                .then(render)
                .catch(function (error) {
                    root.innerHTML =
                        '<div class="state">' +
                            '<h2>Opportunity not available</h2>' +
                            '<p>' +
                                esc(
                                    error.message ||
                                    'This listing may have closed or been unpublished.'
                                ) +
                            '</p>' +
                            '<a class="btn" href="/careers/">Return to Careers</a>' +
                        '</div>';
                });

        })();
    </script>


<script>(function(){var header=document.querySelector('.cm-careers-header');if(!header)return;var menu=header.querySelector('.menu'),nav=header.querySelector('.navlinks');if(!menu||!nav)return;menu.addEventListener('click',function(){var open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));menu.textContent=open?'Close':'Menu';});nav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){nav.classList.remove('open');menu.setAttribute('aria-expanded','false');menu.textContent='Menu';});});})();</script>
