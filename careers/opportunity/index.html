<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#451d29"><meta name="description" content="Opportunity details from Corceptive Media Careers."><title>Opportunity Details | Corceptive Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#f7f1e8;--paper:#fffaf3;--wine:#451d29;--ink:#2c2022;--muted:#766b67;--orange:#d76d34;--line:#e3d6c8;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none}.wrap{width:min(980px,88vw);margin:auto}header{height:76px;background:var(--paper);border-bottom:1px solid var(--line)}.nav{width:min(1200px,90vw);height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;color:var(--wine);font:600 23px var(--serif)}.brand img{width:40px;height:40px;object-fit:contain}.back{font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--orange)}.hero{background:var(--wine);color:var(--paper);padding:58px 0 62px}.eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#e8a26a;font-weight:800}.hero h1{font:500 clamp(43px,6vw,66px)/.96 var(--serif);margin:16px 0 12px;max-width:780px}.lead{font-size:12px;line-height:1.9;color:#f0e3d3c9;max-width:700px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.chip{padding:8px 10px;background:#ffffff14;border:1px solid #ffffff25;font-size:8px;color:#f6e7d7}.content{padding:48px 0 78px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:25px;align-items:start}.main-card,.side-card{background:var(--paper);border:1px solid var(--line);padding:28px}.main-card h2{font:600 28px var(--serif);color:var(--wine);margin:0 0 12px}.main-card p,.main-card li{font-size:11px;line-height:1.9;color:#6d625d}.main-card section+section{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}.main-card ul{padding-left:18px}.side-card{position:sticky;top:22px}.side-card h3{font:600 25px var(--serif);color:var(--wine);margin:0 0 7px}.side-card p{font-size:10px;line-height:1.8;color:var(--muted)}.btn{display:flex;align-items:center;justify-content:center;background:var(--orange);color:white;padding:14px 15px;margin-top:18px;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.tiny{font-size:8px!important;color:#91847a!important;margin-top:13px}.state{margin:60px auto;background:var(--paper);border:1px solid var(--line);padding:32px;max-width:650px;text-align:center}.state h2{font:600 32px var(--serif);color:var(--wine);margin:0 0 9px}.state p{font-size:11px;line-height:1.8;color:var(--muted)}@media(max-width:700px){.layout{grid-template-columns:1fr}.side-card{position:static}.hero{padding:47px 0}.content{padding:32px 0 58px}.main-card,.side-card{padding:22px}}
</style></head><body>
<header><div class="nav"><a class="brand" href="/careers/"><img src="../../Corceptive_Media_Logo.png" alt=""><span>Corceptive Media</span></a><a class="back" href="/careers/">← All opportunities</a></div></header>
<main id="root"><div class="state"><h2>Loading opportunity…</h2><p>Retrieving the latest published details.</p></div></main>
<script>
(function(){
'use strict';var API='https://script.google.com/macros/s/AKfycbwN2yoH-MHqysBi1cJEYj_f1iKbkYgCDHmMvCkzgttRS0uDkLGopfIhR6oPuwZlhqDecQ/exec',params=new URLSearchParams(location.search),type=params.get('type')||'',id=params.get('id')||'',root=document.getElementById('root');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function request(){return new Promise(function(resolve,reject){var cb='cmCareerDetail_'+Math.random().toString(36).slice(2),script=document.createElement('script'),url=new URL(API);url.searchParams.set('action','detail');url.searchParams.set('type',type);url.searchParams.set('id',id);url.searchParams.set('callback',cb);var timer;function clean(){clearTimeout(timer);script.remove();try{delete window[cb];}catch(e){window[cb]=undefined;}}window[cb]=function(data){clean();if(data&&data.ok&&data.item)resolve(data.item);else reject(new Error(data&&data.error||'This opportunity is unavailable.'));};script.onerror=function(){clean();reject(new Error('Could not connect to the Careers service.'));};timer=setTimeout(function(){clean();reject(new Error('The request timed out.'));},12000);script.src=url.toString();document.head.appendChild(script);});}
function entries(v){return v?String(v).split(/\n|\||;/).map(function(x){return x.trim();}).filter(Boolean):[];}
function section(label,value,list){if(!value)return'';if(list){var items=entries(value);return items.length?'<section><h2>'+esc(label)+'</h2><ul>'+items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></section>':'';}return '<section><h2>'+esc(label)+'</h2><p>'+esc(value).replace(/\n/g,'<br>')+'</p></section>';}
function render(item){
var category=type==='early-career'?'Early-career opportunity':type==='projects'?'Project experience':'Internship programme';
var chips=[item.employer,item.duration,item.work_mode,item.location,item.experience_level,item.employment_type].filter(Boolean).slice(0,4);
var desc=item.full_description||item.short_description||'Further information will be shared by the programme team.';
var html=section('About this opportunity',desc,false);
html+=section(type==='early-career'?'Requirements':'Who can apply',item.requirements||item.eligibility,true);
html+=section(type==='projects'?'Expected deliverables':'Responsibilities',item.deliverables||item.responsibilities,true);
html+=section('Learning outcomes',item.learning_outcomes,true);
html+=section('Skills and experience',item.skills,true);
html+=section('Guidance and supervision',item.supervision,true);
var schedule=[item.duration,item.start_date?'Start date: '+item.start_date:'',item.application_deadline?'Application deadline: '+item.application_deadline:''].filter(Boolean).join('\n');
html+=section('Programme details',schedule,false);
html+=section('Compensation',item.compensation_details||item.salary_range||item.compensation_type,false);
root.innerHTML='<section class="hero"><div class="wrap"><p class="eyebrow">'+esc(category)+'</p><h1>'+esc(item.title||'Opportunity details')+'</h1><p class="lead">'+esc(item.short_description||'Review the opportunity details and next steps.')+'</p><div class="meta">'+chips.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join('')+'<span class="chip">'+esc(item.effective_status||'Open')+'</span></div></div></section><section class="content"><div class="wrap layout"><article class="main-card">'+html+'</article><aside class="side-card"><h3>Interested in this opportunity?</h3><p>Contact the Corceptive Media team to ask a question or understand the next step for this listing.</p><a class="btn" href="/contact">Enquire about this opportunity ↗</a><p class="tiny">Please mention: '+esc(item.listing_id||item.title||'Careers opportunity')+'</p></aside></div></section>';
document.title=(item.title||'Opportunity')+' | Corceptive Media Careers';
}
if(!['internships','projects','early-career'].includes(type)||!id){root.innerHTML='<div class="state"><h2>Opportunity not found</h2><p>The requested listing link is incomplete or invalid.</p><a class="btn" style="display:inline-flex" href="/careers/">Return to Careers</a></div>';return;}
request().then(render).catch(function(error){root.innerHTML='<div class="state"><h2>Opportunity not available</h2><p>'+esc(error.message||'This listing may have closed or been unpublished.')+'</p><a class="btn" style="display:inline-flex" href="/careers/">Return to Careers</a></div>';});
})();
</script></body></html>
